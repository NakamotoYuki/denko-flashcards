<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ケーブル最高許容温度 単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9ecef; --sheath:#f8f9fa; --ink:#1d2328; --muted:#5f6b75;
  --line:#c9d0d6; --red:#c8321e; --black:#23292e; --hide:#dfe4e8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15191c; --sheath:#20262b; --ink:#e8ecef; --muted:#9aa6af;
    --line:#343c43; --red:#ff6a52; --black:#cfd6dc; --hide:#2c343a;
  }
}
:root[data-theme="dark"]{
  --bg:#15191c; --sheath:#20262b; --ink:#e8ecef; --muted:#9aa6af;
  --line:#343c43; --red:#ff6a52; --black:#cfd6dc; --hide:#2c343a;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  line-height:1.6;
}
main{max-width:640px; margin:0 auto; padding:28px 18px 48px}
h1{font-size:1.5rem; font-weight:900; margin:0 0 4px; letter-spacing:.02em}
.sub{color:var(--muted); font-size:.92rem; margin:0 0 20px}
/* cable stripe: the three VVF core colours */
.stripe{display:flex; gap:4px; margin:0 0 22px}
.stripe span{height:6px; flex:1; border-radius:3px}
.stripe span:nth-child(1){background:var(--black)}
.stripe span:nth-child(2){background:#fff; border:1px solid var(--line)}
.stripe span:nth-child(3){background:var(--red)}
.tools{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
button{font:inherit}
.tool{
  border:1.5px solid var(--ink); background:transparent; color:var(--ink);
  padding:7px 14px; border-radius:999px; font-size:.9rem; font-weight:700; cursor:pointer;
}
.tool:hover{background:var(--ink); color:var(--sheath)}
.list{list-style:none; margin:0; padding:0; border-top:1px solid var(--line)}
.card{border-bottom:1px solid var(--line)}
.card button{
  width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:transparent; border:0; color:inherit; text-align:left;
  padding:14px 4px; cursor:pointer; min-height:56px;
}
.q{font-weight:700; font-size:1.02rem}
.a{
  flex:none; min-width:6.5em; text-align:center; padding:4px 10px; border-radius:6px;
  background:var(--hide); color:transparent; font-weight:900; font-size:1.1rem;
  transition:background .15s, color .15s; user-select:none;
}
.a::before{content:"タップで表示"; color:var(--muted); font-size:.75rem; font-weight:700}
.card.open .a{background:transparent; color:var(--red)}
.card.open .a::before{content:none}
button:focus-visible{outline:2.5px solid var(--red); outline-offset:2px}
.sum{margin-top:28px; border:1.5px solid var(--line); border-radius:10px; background:var(--sheath)}
.sum > button{
  width:100%; background:transparent; border:0; color:inherit; cursor:pointer;
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 16px; font-weight:900; font-size:1.05rem;
}
.chev{transition:transform .2s}
.sum.open .chev{transform:rotate(90deg)}
.sum .body{display:none; padding:0 12px 14px}
.sum.open .body{display:block}
.scroll{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:.92rem; min-width:420px}
th,td{padding:8px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top}
th{color:var(--muted); font-weight:700; font-size:.82rem}
td.t{font-weight:900; color:var(--red); white-space:nowrap}
td.k{font-weight:900; white-space:nowrap}
.hint{margin-top:12px; font-size:.88rem; color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>ケーブルの最高許容温度</h1>
  <p class="sub">問題をタップすると答えが出ます。もう一度タップで隠れます。</p>
  <div class="stripe" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="tools">
    <button class="tool" id="showAll">全部表示</button>
    <button class="tool" id="hideAll">全部隠す</button>
    <button class="tool" id="shuffle">並べ替え</button>
  </div>

  <ul class="list" id="list"></ul>

  <section class="sum" id="sum">
    <button aria-expanded="false" aria-controls="sumBody"><span>まとめ表</span><span class="chev" aria-hidden="true">▶</span></button>
    <div class="body" id="sumBody">
      <div class="scroll">
        <table>
          <thead><tr><th>略号</th><th>名称</th><th>最高許容温度</th></tr></thead>
          <tbody>
            <tr><td class="k">VVF</td><td>ビニル絶縁ビニル外装ケーブル平形</td><td class="t">60℃</td></tr>
            <tr><td class="k">VVR</td><td>ビニル絶縁ビニル外装ケーブル丸形</td><td class="t">60℃</td></tr>
            <tr><td class="k">EM-EEF</td><td>エコマテリアル ポリエチレン絶縁 耐熱性ポリエチレンシースケーブル平形</td><td class="t">75℃</td></tr>
            <tr><td class="k">CV</td><td>架橋ポリエチレン絶縁ビニルシースケーブル</td><td class="t">90℃</td></tr>
            <tr><td class="k">MI</td><td>無機絶縁ケーブル</td><td class="t">250℃</td></tr>
          </tbody>
        </table>
      </div>
      <p class="hint">温度は絶縁体の材料で決まります：ビニル 60℃ → ポリエチレン 75℃ → 架橋ポリエチレン 90℃ → 無機物 250℃</p>
    </div>
  </section>
</main>
<script>
const cards = [
  ["VVF の最高許容温度は？","60℃"],
  ["VVR の最高許容温度は？","60℃"],
  ["EM-EEF の最高許容温度は？","75℃"],
  ["CV の最高許容温度は？","90℃"],
  ["MI の最高許容温度は？","250℃"],
  ["60℃のケーブルは？","VVF・VVR"],
  ["75℃のケーブルは？","EM-EEF"],
  ["90℃のケーブルは？","CV"],
  ["250℃のケーブルは？","MI"]
];
const list = document.getElementById("list");
function render(order){
  list.innerHTML = "";
  order.forEach(([q,a])=>{
    const li = document.createElement("li");
    li.className = "card";
    const b = document.createElement("button");
    b.setAttribute("aria-expanded","false");
    b.innerHTML = `<span class="q"></span><span class="a"></span>`;
    b.querySelector(".q").textContent = q;
    b.querySelector(".a").textContent = a;
    b.addEventListener("click",()=>{
      const open = li.classList.toggle("open");
      b.setAttribute("aria-expanded", open);
    });
    li.appendChild(b);
    list.appendChild(li);
  });
}
render(cards);
function setAll(open){
  document.querySelectorAll(".card").forEach(li=>{
    li.classList.toggle("open",open);
    li.querySelector("button").setAttribute("aria-expanded",open);
  });
}
document.getElementById("showAll").onclick = ()=>setAll(true);
document.getElementById("hideAll").onclick = ()=>setAll(false);
document.getElementById("shuffle").onclick = ()=>{
  const c = cards.slice();
  for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}
  render(c);
};
const sum = document.getElementById("sum");
const sb = sum.querySelector("button");
sb.addEventListener("click",()=>{
  const open = sum.classList.toggle("open");
  sb.setAttribute("aria-expanded",open);
});
</script>
</body>
</html>
